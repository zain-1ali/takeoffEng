<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Structural Works Take-off</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#F3F4F2;--surface:#FFFFFF;--sunk:#E6E8E5;--line:#CDD1CC;--ink:#18232E;--muted:#5E6973;
  --input:#1F55A8;--inputbg:#FFFBEA;--hivis:#E3A800;--hivis-soft:#FFF1C2;--warn:#B3261E;--warnbg:#FCE9E7;--ok:#2E6B3F;
  --soil:#C9B89A;--soil-dark:#A8946F;--conc:#C3C7C9;--blind:#8E9496;--steel:#8A3F17;--core:#2F5D8A;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171C;--surface:#1A2128;--sunk:#232C34;--line:#34404A;--ink:#E7EBEE;--muted:#9AA6B0;
  --input:#8DB8FF;--inputbg:#1F2A36;--hivis:#F0BE2A;--hivis-soft:#3A3118;--warn:#FF8A80;--warnbg:#3A1F1D;--ok:#7CC48E;
  --soil:#5C5140;--soil-dark:#7A6B52;--conc:#6F777C;--blind:#50575B;--steel:#F09A66;--core:#7FA8D6}}
:root[data-theme="dark"]{
  --paper:#12171C;--surface:#1A2128;--sunk:#232C34;--line:#34404A;--ink:#E7EBEE;--muted:#9AA6B0;
  --input:#8DB8FF;--inputbg:#1F2A36;--hivis:#F0BE2A;--hivis-soft:#3A3118;--warn:#FF8A80;--warnbg:#3A1F1D;--ok:#7CC48E;
  --soil:#5C5140;--soil-dark:#7A6B52;--conc:#6F777C;--blind:#50575B;--steel:#F09A66;--core:#7FA8D6}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}input,select{font:inherit}
:focus-visible{outline:2px solid var(--hivis);outline-offset:2px}
[hidden]{display:none!important}

.bar{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap;min-height:62px}
.brand{flex:1 1 280px;min-width:0;display:flex;flex-direction:column}
.brand input{background:transparent;border:0;border-bottom:1px dashed #4A5A69;color:#fff;font-family:var(--cond);font-size:21px;font-weight:600;padding:0 0 2px;width:100%;max-width:560px}
.brand input:focus{outline:none;border-bottom-color:var(--hivis)}
.brand small{color:#9FB0BF;font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;font-weight:600;white-space:nowrap}
.bar .btn{background:transparent;border-color:#4A5A69;color:#fff}
.btn.primary,.bar .btn.primary{background:var(--hivis);border-color:var(--hivis);color:#18232E}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 62px)}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:14px 12px;position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);overflow:auto}
.nav h2{font-family:var(--cond);font-size:13px;color:var(--muted);font-weight:600;margin:14px 8px 6px}
.btype{display:grid;grid-template-columns:1fr;gap:4px;background:var(--sunk);border-radius:9px;padding:4px;margin-bottom:6px}
.btype button{border:0;background:transparent;border-radius:6px;padding:6px 8px;font-weight:600;font-size:13px;text-align:left}
.btype button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.nav .step{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:7px 10px;font-weight:600}
.nav .step .ix{font-family:var(--cond);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:13px;flex:none}
.nav .step:hover{background:var(--sunk)}
.nav .step[aria-current="true"]{background:var(--ink);color:var(--paper)}
.nav .step[aria-current="true"] .ix{background:var(--hivis);color:#18232E}
.navtot{margin:16px 6px 0;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.navtot div{display:flex;justify-content:space-between;padding:3px 0;gap:8px}
.navtot b{font-family:var(--cond);font-size:15px}

.work{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-width:0}
.work.full{grid-template-columns:minmax(0,1fr)}
.main{padding:22px 26px 80px;min-width:0}
.side{border-left:1px solid var(--line);background:var(--surface);padding:18px;position:sticky;top:62px;align-self:start;max-height:calc(100vh - 62px);overflow:auto}
.work.full .side{display:none}
.side h3{font-family:var(--cond);font-size:14px;color:var(--muted);margin:0 0 8px;font-weight:600}
.side svg{width:100%;height:auto;display:block;background:var(--paper);border-radius:8px;margin-bottom:14px}
.pagehead{margin:0 0 16px}
.pagehead h1{font-family:var(--cond);font-size:34px;line-height:1.1;margin:0}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:75ch}

fieldset{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0 0 14px;padding:16px 20px 18px;min-width:0}
legend{float:left;width:100%;padding:0;margin:0 0 12px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
legend .hint{font-weight:400;font-size:13px;color:var(--muted)}
legend+*{clear:both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.f .lab{font-size:13px;font-weight:600;color:var(--muted)}
.box{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:7px;background:var(--inputbg);overflow:hidden}
.box:focus-within{border-color:var(--hivis);box-shadow:0 0 0 3px var(--hivis-soft)}
.box input,.box select{flex:1;min-width:0;border:0;background:transparent;color:var(--input);font-family:var(--cond);font-weight:600;font-size:17px;padding:6px 9px;font-variant-numeric:tabular-nums}
.box select{font-family:var(--sans);font-size:14px;cursor:pointer}
.box input.t{font-family:var(--sans);font-size:15px;font-weight:500}
.box input:focus,.box select:focus{outline:none}
.box .u{display:grid;place-items:center;padding:0 8px;color:var(--muted);font-size:12px;border-left:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.box .stp{border:0;background:transparent;color:var(--muted);width:26px;font-size:16px;flex:none}
.box .stp:hover{background:var(--sunk);color:var(--ink)}
.readout{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:7px 12px;background:var(--sunk);border-radius:7px}
.readout small{font-size:12px;color:var(--muted)}.readout b{font-family:var(--cond);font-size:18px}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer;user-select:none}
.switch input{appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;margin:0;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--ok)}.switch input:checked::after{left:21px}
.toggles{display:flex;flex-wrap:wrap;gap:14px 26px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:40px;padding:4px 9px;font-family:var(--cond);font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.btcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btcard{border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left;background:var(--surface)}
.btcard b{display:block;font-family:var(--cond);font-size:21px}
.btcard span{color:var(--muted);font-size:14px}
.btcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--hivis)}

.types{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:stretch}
.tchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;text-align:left;display:flex;flex-direction:column;min-width:96px}
.tchip b{font-family:var(--cond);font-size:18px;line-height:1.1}
.tchip small{color:var(--muted);font-size:12px;white-space:nowrap}
.tchip[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.tchip[aria-current="true"] small{color:#C5D0DA}
.tchip.add{border-style:dashed;justify-content:center;align-items:center;color:var(--muted);font-weight:600}
.grp{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 16px;padding:12px 0;border-top:1px dashed var(--line);align-items:start}
.grp:first-of-type{border-top:0;padding-top:4px}
.grp>.gname{font-weight:700;padding-top:22px}
.grp>.gname small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.gfields{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.gfields .f{width:178px}
.gfields .f.wide{width:auto;min-width:150px}
.typetools{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table.pl{border-collapse:collapse;width:100%;min-width:640px}
.pl th{background:var(--sunk);font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.pl th.n,.pl td.n{text-align:right}
.pl td{padding:4px 5px;border-bottom:1px solid var(--line);vertical-align:middle}
.pl .box input{font-size:15px;padding:4px 6px;min-width:56px;width:100%}
.pl .box select{font-size:14px;padding:4px 6px;min-width:90px}
.pl .box input.t{min-width:120px}
.pl td.calc{font-family:var(--cond);font-size:14px;font-weight:600;white-space:nowrap;color:var(--muted);text-align:right}
.pl tr.lvlhead td{background:var(--hivis-soft);font-family:var(--cond);font-weight:700;font-size:15px;padding:5px 8px}
.x{border:0;background:none;color:var(--muted);font-size:18px;width:28px;height:28px;border-radius:6px}
.x:hover{background:var(--warnbg);color:var(--warn)}
.rowtools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0;align-items:center}
.rowtools .lbl{color:var(--muted);font-size:14px}
.rowtools select{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--surface);color:var(--ink)}

.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.alert{background:var(--warnbg);color:var(--warn);border-radius:7px;padding:7px 12px;font-size:14px}

.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.dt{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
.dt th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap}
.dt td{padding:6px 10px;border-bottom:1px solid var(--line)}
.dt .n{text-align:right;font-family:var(--cond);font-variant-numeric:tabular-nums;white-space:nowrap}
.dt td.n{font-size:15px}
.dt td.sq{font-weight:700;border-left:2px solid var(--ink)}
.dt tr.ph td{background:var(--hivis-soft);font-weight:700;font-family:var(--cond);font-size:16px}
.dt tr.ws td{background:var(--sunk);font-weight:700}
.dt td.code{color:var(--muted);font-size:12px}
.dt td.rate{width:130px;padding:3px 8px}
.dt td.rate .box input{font-size:15px;padding:4px 8px;text-align:right}
.dt tfoot td{font-weight:700;font-family:var(--cond);font-size:18px;border-bottom:0}
.dt tr.sub td{font-weight:600;color:var(--muted);font-size:13px}
.filter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filter select{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--surface);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi small{color:var(--muted);font-size:13px;display:block}
.kpi b{font-family:var(--cond);font-size:30px;line-height:1.1;display:block}
.kpi span{font-size:13px;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.chart h3{margin:0 0 12px;font-size:16px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.hbar .track{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.hbar .fill{height:100%;background:var(--ink)}.hbar .fill.s{background:var(--steel)}
.hbar b{font-family:var(--cond);text-align:right;font-size:15px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.tag.ok{background:transparent;color:var(--ok)}.tag.no{background:var(--warnbg);color:var(--warn)}
.quick{font-size:13px}
.quick div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.quick b{font-family:var(--cond);font-size:15px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px}


.btype .bthead{grid-column:1/-1;font-size:11px;color:var(--muted);padding:4px 8px 0;font-weight:700}
.report{max-width:980px;margin:0 auto}
.rtool{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;position:sticky;top:72px;z-index:5}
.rtool .sp{flex:1}
.mini{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.mini .box input{width:64px;font-size:15px;padding:4px 6px}
.page{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:46px 54px 40px;margin-bottom:18px}
.rhead{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:3px solid var(--ink);padding-bottom:18px;margin-bottom:18px}
.rhead .kicker{font-family:var(--cond);font-size:14px;color:var(--muted);font-weight:600}
.rhead h1{font-family:var(--cond);font-size:42px;margin:2px 0 6px;line-height:1}
.rhead .proj{font-size:18px;font-weight:600}
.stamp{border:2px solid var(--ink);padding:10px 16px;text-align:right;min-width:170px}
.stamp small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stamp b{display:block;font-family:var(--cond);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
  .meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 24px;margin-bottom:20px;font-size:14px}
.meta small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.notes{background:var(--paper);border-left:3px solid var(--hivis);padding:10px 14px;font-size:13px;margin-bottom:8px}
.bill{margin-top:28px}
.bill h2{font-family:var(--cond);font-size:22px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.bill h2 small{font-size:13px;color:var(--muted);font-family:var(--sans);font-weight:500}
table.rt{width:100%;border-collapse:collapse;font-size:13.5px}
.rt th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.rt td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.rt .n{text-align:right;font-family:var(--cond);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14.5px}
.rt td.item{font-family:var(--cond);font-weight:700;width:40px}
.rt td.rate{width:116px}
.rt .rate input{width:100%;text-align:right;border:1px solid var(--line);background:var(--inputbg);color:var(--input);font-family:var(--cond);font-weight:600;font-size:14.5px;padding:3px 6px;border-radius:5px}
.rt .rate input:focus{outline:none;border-color:var(--hivis);box-shadow:0 0 0 3px var(--hivis-soft)}
.rt tr.btot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700;font-family:var(--cond);font-size:16px;padding-top:9px}
.gs .rt td{font-size:15px}
.rt tr.grand td{background:var(--ink);color:var(--paper);font-family:var(--cond);font-weight:700;font-size:21px;padding:10px 8px}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:44px}
.sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:13px;color:var(--muted)}
.sign b{color:var(--ink)}
@media print{
  :root{--paper:#fff;--surface:#fff;--sunk:#EEE;--line:#BBB;--ink:#111;--muted:#555;--input:#111;--inputbg:transparent;--hivis:#C99700;--hivis-soft:#FFF4CC}
  body{background:#fff}.bar,.nav,.side,.rtool,.no-print,.toast{display:none!important}
  .shell,.work{display:block}.main{padding:0}.page{border:0;padding:0;margin:0}
  .rt .rate input{border:0;padding:0}.bill h2{break-after:avoid}.rt tr{break-inside:avoid}.gs{break-before:page}
}
@media (max-width:1280px){.work{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:16px}}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav .steps{display:flex;gap:4px;overflow-x:auto}.nav .step{width:auto;flex:none}
  .nav h2,.navtot{display:none}
  .btype{grid-template-columns:repeat(3,1fr)}
  .main{padding:16px}.side{grid-template-columns:1fr}.bar{position:static}
  .page{padding:22px 16px}.meta{grid-template-columns:1fr 1fr}.rhead{grid-template-columns:1fr}.rtool{position:static}
  .grp{grid-template-columns:1fr}.grp>.gname{padding-top:0}
  .gfields .f{width:calc(50% - 7px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.rakpis{display:grid;grid-template-columns:180px 220px minmax(240px,1fr) auto;gap:12px;margin-bottom:16px}
.rakpis .kpi b{font-size:26px}
.meter{height:6px;background:var(--sunk);border-radius:3px;margin-top:8px;overflow:hidden}.meter span{display:block;height:100%;background:var(--ok)}
.cbar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sunk);margin-top:8px}.cbar span{display:block;height:100%}
.clegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}.clegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rasets{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mini{display:flex;flex-direction:column;font-size:12px;font-weight:600;color:var(--muted);gap:3px}
.mini .box input{width:64px;font-size:15px;padding:4px 6px}
.ra2{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
.ralist{background:var(--surface);border:1px solid var(--line);border-radius:10px;position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column;overflow:hidden}
.rasearch{padding:10px;border-bottom:1px solid var(--line)}
#raList{overflow:auto}

  if(kinds.includes("bwall"))S.pl.bwall.forEach(pl=>{const t=used("bwall",pl);if(!t)return;

  if(kinds.includes("bbeam"))S.pl.bbeam.forEach(pl=>{const t=used("bbeam",pl);if(!t)return;

  if(kinds.includes("bslab"))S.pl.bslab.forEach(pl=>{const t=used("bslab",pl);if(!t)return;

    bar(ctx,"Straight + anchorage",t.byd,nB(Lx-2*c,t.bys),stock(Wy+2*an*n(t.byd)/1000,t.byd));
    if(t.topMode==="full"){bar(ctx,"Straight + anchorage (top)",t.txd,nB(Wy-2*c,t.txs),stock(Lx+2*an*n(t.txd)/1000,t.txd));bar(ctx,"Straight + anchorage (top)",t.tyd,nB(Lx-2*c,t.tys),stock(Wy+2*an*n(t.tyd)/1000,t.tyd))}

  /* ---- road ---- */
  if(kinds.includes("rpave")){let cut=0,fill=0,totL=0;
    const ch=v=>`${Math.floor(n(v)/1000)}+${String(Math.round(n(v)%1000)).padStart(3,"0")}`;

  const formwork=sum(/^F(?!STRIS|F_)/);
  const floorArea=S.btype==="foundation"?n(S.sog.area):S.pl.slab.filter(inLv).reduce((a,pl)=>{const t=typeOf("slab",pl.type);return a+(t?n(pl.no)*n(pl.L)*n(pl.W)-n(pl.less):0)},0)+n(S.sog.area);
  Object.values(S.types).flat().forEach(t=>{if(!byType[t.id])byType[t.id]={conc:0,kg:0,uses:0}});
  return {items,bars,warn:[...new Set(warn)],tot,sum,concrete,steelKg,formwork,byPl,byType,floorArea,lvls};
}

const GRP_LABEL={FND:"foundations and ground beams",COL:"columns",BEAM:"beams",SLAB:"suspended slabs",WALL:"walls",STAIR:"staircases",BFND:"bridge footings",PIER:"piers and crossheads",ABUT:"abutments and wingwalls",DECK:"deck girders and slabs",PARA:"parapets",CULV:"culvert headwalls"};
function catalogue(){
  const g=S.grades,rl=S.rules,C=[],B=["1.00","2.00","4.00","OVER4"];
  const sec=(t,rows)=>rows.forEach(r=>C.push({sec:t,code:r[0],unit:r[1],desc:r[2]}));

  if(!LEVELLED.has(k))h+=`<button class="btn sm" data-act="addRow" data-k="${k}">Add row</button>`;

  h+=`</div>`;return h}

  <div class="kpi"><small>Cost from BOQ</small><b>${cost?fmt(cost,0):"–"}</b><span>${cost?esc(curLabel()):"Enter rates in the bill"}</span></div></div>
  <div class="chart"><h3>Reinforcement by element and diameter (kg)</h3><p style="margin:-6px 0 10px;color:var(--muted);font-size:13px">Ratios exclude the mesh-reinforced ground slab. Beam concrete is measured below the slab, so beam ratios read higher than full-section figures.</p><div class="scroll" style="border:0"><table class="dt" style="min-width:640px"><thead><tr><th>Element</th>${dias.map(d=>`<th class="n">${d} mm</th>`).join("")}<th class="n">Total kg</th><th class="n">kg/m³</th><th>Typical range</th></tr></thead><tbody>

  <tr class="ws"><td>Total</td>${dias.map(d=>`<td class="n">${fmt(R.bars.filter(b=>b.dia===d).reduce((a,b)=>a+b.kg,0),0)}</td>`).join("")}<td class="n sq">${fmt(R.steelKg,0)}</td><td></td><td></td></tr></tbody></table></div></div>

function gradeOf(code){const g=S.grades;if(code==="BLD"||code==="CBED")return g.blind;if(["CPAD","CSTUB","CSTRIP","CGB","CSOG","CBFT","CAPPR"].includes(code))return g.found;if(["CCOL","CBEAM","CSLAB","CWALL","CSTAIR"].includes(code))return g.frame;if(["CDRN","CHW","CAPR"].includes(code))return g.civil;return g.bridge}
function mixFor(gr){const c=+((String(gr).match(/C\s*(\d+)/i)||[])[1]||25);const ks=Object.keys(S.mix).map(Number).sort((a,b)=>a-b);let k=ks[0];ks.forEach(x=>{if(x<=c)k=x});return S.mix[k]}
function bomRows(R){
  const m=S.mat,T=R.tot,out=[];let pending="";
  const sec=t=>{pending=t};
  const row=(code,mat,spec,unit,net,waste)=>{if(!(net>0.0005))return;if(pending){out.push({sec:pending});pending=""}
    const w=n(waste),int=INT_UNITS.has(unit);let order=net*(1+w/100);if(int)order=Math.ceil(order-1e-9);const man=S.mrates[code],rate=man??dbPrice(code);
    out.push({code,mat,spec,unit,net,waste:w,order,dp:int?1:(unit==="t"?3:2),odp:int?0:(unit==="t"?3:2),rate,man,amt:rate?order*rate:0})};
  const sumC=re=>Object.keys(T).filter(k=>re.test(k)).reduce((a,k)=>a+T[k],0);
  sec("Concrete");
  const vol={};R.items.forEach(i=>{if(CONC.has(i.code)||i.code==="BLD"){const gr=gradeOf(i.code);vol[gr]=(vol[gr]||0)+i.q}});
  const gs=Object.keys(vol).filter(g=>vol[g]>0.0005);
  if(m.readymix)gs.forEach(g=>row("RMX-"+g,`Ready-mix concrete ${g}`,"Delivered to site, pumping priced separately","m³",vol[g],m.concWaste));
  else{let cem=0,sand=0,agg=0,water=0;gs.forEach(g=>{const x=mixFor(g);cem+=vol[g]*n(x.cem);sand+=vol[g]*n(x.sand);agg+=vol[g]*n(x.agg);water+=vol[g]*0.18});
    const split=gs.map(g=>`${g} ${fmt(vol[g],1)} m³`).join(" · ");
    row("CEM","Cement CEM I 42.5N",`50 kg bags for ${split}`,"bags",cem/50,m.concWaste);
    row("SAND","River sand","Fine aggregate for concrete","m³",sand,m.concWaste);
    row("AGG","Crushed aggregate 20 mm","Coarse aggregate for concrete","m³",agg,m.concWaste);
    row("WATER","Water","Mixing and curing, 180 l/m³","m³",water,0)}
  sec("Reinforcement");
  DIAS.forEach(d=>{const kg=R.bars.filter(b=>b.dia===d).reduce((a,b)=>a+b.kg,0);if(!kg)return;const L=n(m.stock)||12;
    row("BAR"+d,`${d>=10?"High yield":"Mild steel"} bar ${d} mm`,`About ${Math.ceil(kg*(1+n(m.steelWaste)/100)/(L*kgm(d)))} No. ${fmt(L,0)} m lengths`,"t",kg/1000,m.steelWaste)});
  row("WIRE","Binding wire","16 SWG annealed, "+m.wire+" kg per tonne","kg",R.steelKg/1000*n(m.wire),0);
  const meshA=(T.MESH||0)+(T.MESHD||0);row("MESHS","Steel fabric mesh",`${esc(S.btype==="road"?"A142":S.sog.mesh)} sheets 4.8 × 2.4 m with ${m.meshLap}% laps`,"sheets",meshA*(1+n(m.meshLap)/100)/11.52,m.meshWaste);
  sec("Formwork");
  const F=R.formwork,uses=Math.max(1,n(m.uses));
  row("PLY","Plywood 18 mm shuttering",`1.22 × 2.44 m sheets, ${uses} uses`,"sheets",F/2.9768/uses,m.fwWaste);
  row("TIMB","Sawn timber 50 × 100 mm",`${m.timber} m per m² of formwork, ${uses} uses`,"m",F*n(m.timber)/uses,m.fwWaste);
  row("NAILS","Wire nails, assorted",`${m.nails} kg per m²`,"kg",F*n(m.nails),0);
  row("REL","Mould release agent","0.1 l per m²","l",F*0.1,m.fwWaste);
  sec("Fill, membranes and treatment");
  row("HC","Hardcore",`Loose volume at compaction factor ${m.compact}`,"m³",(T.HARD||0)*n(m.compact),0);
  row("SANDB","Blinding sand",`${S.sog.sand} mm thick, loose`,"m³",(T.SAND||0)*n(S.sog.sand)/1000*1.25,0);
  row("DPMR","Polythene membrane 1000 gauge","100 m² rolls, 15% laps","rolls",(T.DPM||0)*1.15/100,0);
  row("ATTL","Anti-termite chemical",`Diluted, ${m.att} l per m²`,"l",(T.ATT||0)*n(m.att),0);
  row("BORR","Imported fill",`Loose volume at factor ${m.compact}`,"m³",(T.RBORROW||0)*n(m.compact),0);
  row("BFGRM","Granular backfill to abutments",`Loose volume at factor ${m.compact}`,"m³",(T.BFGR||0)*n(m.compact),0);
  if(typeof finBomRows==="function")finBomRows(R,row,sec);
  if(typeof mepBomRows==="function")mepBomRows(R,row,sec);
  if(typeof roofBomRows==="function")roofBomRows(R,row,sec);
  sec("Pavement materials");
  row("CRS","Graded crushed stone","Base course, loose factor 1.30","m³",sumC(/^BASE/)*1.3,m.aggWaste);
  row("GRV","Natural gravel","Subbase, loose factor 1.25","m³",sumC(/^SUBB/)*1.25,m.aggWaste);
  row("CAPM","Selected gravel","Improved subgrade, loose factor 1.25","m³",sumC(/^CAP\d/)*1.25,m.aggWaste);
  let asW=0,asB=0;R.items.forEach(i=>{const tt=(S.types.rpave||[]).find(x=>x.id===i.tid);if(!tt)return;if(/^ACW/.test(i.code))asW+=i.q*n(tt.acw)/1000*n(tt.dens);if(/^ACB/.test(i.code))asB+=i.q*n(tt.acb)/1000*n(tt.dens)});
  row("ACWM","Asphalt concrete wearing course","Hot mix, at section density","t",asW,m.asWaste);
  row("ACBM","Dense bitumen macadam","Binder course, hot mix","t",asB,m.asWaste);
  row("MC30","Cutback bitumen MC-30",`Prime coat, ${m.prime} l/m²`,"l",(T.PRIME||0)*n(m.prime),m.bitWaste);
  row("K160","Bitumen emulsion K1-60",`Tack coat, ${m.tack} l/m²`,"l",(T.TACK||0)*n(m.tack),m.bitWaste);
  row("SDSB","Penetration bitumen 80/100","Surface dressing, 1.8 l/m² for two coats","l",(T.SDS||0)*1.8,m.bitWaste);
  row("CHIP","Chippings 14 mm and 10 mm","Surface dressing, 0.018 m³/m²","m³",(T.SDS||0)*0.018,m.aggWaste);
  sec("Drainage, furniture and bridge items");
  [...new Set((S.types.rculv||[]).map(t=>String(t.dia)))].forEach(d=>row("PIPEU"+d,`Precast concrete pipe ${d} mm`,`${fmt(n(m.pipeLen),1)} m units, spigot and socket`,"No.",(T["PIPE"+d]||0)/Math.max(n(m.pipeLen),0.1),2));
  row("KERBU","Precast concrete kerbs","1.0 m units","No.",T.KERB||0,3);
  row("PAINT","Thermoplastic road marking",`${m.paint} kg per m of 100 mm line`,"kg",(T.RMARK||0)*n(m.paint),5);
  row("SIGNS","Road signs with posts","To sign schedule","No.",T.RSIGN||0,0);
  row("GRAILM","W-beam guardrail","With posts and fixings","m",T.GRAIL||0,2);
  row("STUDS","Road studs","Reflective, bi-directional","No.",T.RSTUD||0,2);
  row("KMPM","Kilometre posts","Precast concrete","No.",T.KMP||0,0);
  row("BRGM","Elastomeric bearings","To bearing schedule","No.",T.BRG||0,0);

function parseCsv(txt){const rows=[];let row=[],cell="",q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];

/* ---------- chart kit ---------- */
const PAL=["var(--ink)","var(--steel)","var(--core)","var(--hivis)","var(--ok)","#8E6AC8","#C0567A","#3E9EA0","#9AA6B0","#D98E3F","#5B7F2E","#B8860B"];
const short=(s,k=30)=>{s=String(s);return s.length>k?s.slice(0,k-1)+"…":s};
function donut(data,{size=180,center="",sub=""}={}){
  data=data.filter(d=>d.value>0);const tot=data.reduce((a,d)=>a+d.value,0);if(!tot)return `<div class="empty">No data yet</div>`;
  const r=size/2-14,cx=size/2,cy=size/2,C=2*Math.PI*r;let off=0;
  const segs=data.map((d,i)=>{const len=d.value/tot*C;const s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" style="stroke:${d.color||PAL[i%PAL.length]}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(d.label)}: ${fmt(d.value/tot*100,1)}%</title></circle>`;off+=len;return s}).join("");
  return `<div class="donut"><svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Donut chart">${segs}<text x="${cx}" y="${cy-2}" text-anchor="middle" class="dc1">${esc(center)}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" class="dc2">${esc(sub)}</text></svg>
  <ul class="legend">${data.map((d,i)=>`<li><i style="background:${d.color||PAL[i%PAL.length]}"></i><span>${esc(d.label)}</span><b>${fmt(d.value/tot*100,1)}%</b>${d.show?`<small>${d.show}</small>`:""}</li>`).join("")}</ul></div>`}
function hbars(data,unit,dp=1,color){data=data.filter(d=>d.value>0);const m=Math.max(1e-9,...data.map(d=>d.value));if(!data.length)return `<div class="empty">No data yet</div>`;
  return data.map((d,i)=>`<div class="hbar"><span title="${esc(d.label)}">${esc(short(d.label,22))}</span><div class="track"><div class="fill" style="width:${d.value/m*100}%;background:${color||d.color||"var(--ink)"}"></div></div><b>${fmt(d.value,dp)}${unit?` <small>${unit}</small>`:""}</b></div>`).join("")}
function vbars(data,{unit="",dp=1,h=190,color="var(--ink)"}={}){data=data.filter(d=>d.value>0);if(!data.length)return `<div class="empty">No data yet</div>`;
  const W=Math.max(320,data.length*56),m=Math.max(...data.map(d=>d.value)),bw=Math.min(40,W/data.length*0.6),top=22,base=h-34;
  return `<svg class="vb" viewBox="0 0 ${W} ${h}" role="img" aria-label="Column chart">${[0,.5,1].map(t=>`<line x1="0" x2="${W}" y1="${base-(base-top)*t}" y2="${base-(base-top)*t}" style="stroke:var(--line)" stroke-dasharray="${t?"3 3":""}"/>`).join("")}
  ${data.map((d,i)=>{const x=(i+.5)*W/data.length,bh=(base-top)*d.value/m;return `<rect x="${x-bw/2}" y="${base-bh}" width="${bw}" height="${bh}" rx="3" style="fill:${d.color||color}"><title>${esc(d.label)}: ${fmt(d.value,dp)} ${unit}</title></rect><text x="${x}" y="${base-bh-6}" text-anchor="middle" class="vl">${fmt(d.value,dp)}</text><text x="${x}" y="${base+16}" text-anchor="middle" class="vx">${esc(short(d.label,10))}</text>`}).join("")}</svg>`}
function pareto(items,cur){items=items.filter(i=>i.amt>0).sort((a,b)=>b.amt-a.amt);const tot=items.reduce((a,i)=>a+i.amt,0);const top=items.slice(0,10);if(!top.length)return `<div class="empty">Price the bill to see the top cost items</div>`;

  return `<svg class="vb" viewBox="0 0 ${W} ${H}" role="img" aria-label="Top cost items">${[0,.25,.5,.75,1].map(k=>`<line x1="${l}" x2="${W-r}" y1="${t+(H-t-b)*(1-k)}" y2="${t+(H-t-b)*(1-k)}" style="stroke:var(--line)" stroke-dasharray="3 3"/><text x="${W-r+4}" y="${t+(H-t-b)*(1-k)+4}" class="vx" text-anchor="start">${k*100}%</text>`).join("")}
  ${top.map((it,i)=>{const bh=(H-t-b)*it.amt/tot;return `<rect x="${l+bw*i+bw*.15}" y="${H-b-bh}" width="${bw*.7}" height="${bh}" rx="2" style="fill:var(--steel)"><title>${esc(it.desc)} – ${fmt(it.amt,0)} ${cur}</title></rect><text x="${l+bw*(i+.5)}" y="${H-b+15}" text-anchor="middle" class="vx">${it.item}</text>`}).join("")}
  <polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" style="stroke:var(--ink)" stroke-width="2"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" style="fill:var(--ink)"/>`).join("")}
  <text x="${l}" y="${H-14}" class="vx" text-anchor="start">Top ${top.length} items = ${fmt(cum/tot*100,1)}% of the bill · bars show share of total, line is cumulative</text></svg>
  <ol class="toplist">${top.slice(0,5).map(it=>`<li><b>${it.item}</b> ${esc(short(it.desc,70))}<span>${fmt(it.amt,0)}</span></li>`).join("")}</ol>`}
function waterfall(T,cur){const steps=[["Measured work",T.sub,"var(--ink)"],[`Contingency ${fmt(n(S.report.cont),1)}%`,T.cont,"var(--hivis)"],[`${S.report.taxName||"Tax"} ${fmt(n(S.report.vat),1)}%`,T.tax,"var(--core)"]];

  <rect x="${cw*3+cw*.2}" y="${top}" width="${cw*.6}" height="${base-top}" rx="2" style="fill:var(--ok)"/><text x="${cw*3.5}" y="${top-6}" text-anchor="middle" class="vl">${fmt(T.tot,0)}</text><text x="${cw*3.5}" y="${base+16}" text-anchor="middle" class="vx">Total ${esc(cur)}</text>

  if(t==="road")g=`<path d="M0 260 L400 150 L800 260 Z" style="fill:var(--conc)" opacity=".45"/><path d="M330 170 L470 170 L800 260 L0 260 Z" style="fill:var(--ink)" opacity=".85"/>${[0,1,2,3,4].map(i=>`<path d="M${398-i*2} ${176+i*18} L${402+i*2} ${176+i*18} L${404+i*3} ${186+i*18} L${396-i*3} ${186+i*18} Z" style="fill:var(--hivis)"/>`).join("")}`;
  else if(t==="bridge")g=`<rect x="0" y="210" width="800" height="50" style="fill:var(--core)" opacity=".35"/><rect x="60" y="120" width="680" height="22" style="fill:var(--ink)"/>${[260,540].map(x=>`<rect x="${x-10}" y="142" width="20" height="90" style="fill:var(--ink)" opacity=".8"/>`).join("")}<rect x="40" y="120" width="30" height="110" style="fill:var(--ink)"/><rect x="730" y="120" width="30" height="110" style="fill:var(--ink)"/>${Array.from({length:20},(_,i)=>`<line x1="${80+i*34}" y1="104" x2="${80+i*34}" y2="120" style="stroke:var(--ink)" stroke-width="2"/>`).join("")}<line x1="70" y1="104" x2="730" y2="104" style="stroke:var(--ink)" stroke-width="2"/>`;
  else{const fl=Math.max(1,activeLevels().length||1),h=Math.min(26,170/fl);g=`<rect x="0" y="236" width="800" height="24" style="fill:var(--soil)" opacity=".6"/>${Array.from({length:fl},(_,i)=>`<rect x="250" y="${236-(i+1)*h}" width="300" height="${h-4}" style="fill:var(--conc)" opacity=".7"/>${Array.from({length:6},(_,j)=>`<rect x="${266+j*46}" y="${236-(i+1)*h+4}" width="30" height="${h-12}" style="fill:var(--core)" opacity=".55"/>`).join("")}<rect x="244" y="${236-(i+1)*h-4}" width="312" height="4" style="fill:var(--ink)"/>`).join("")}<rect x="600" y="40" width="6" height="196" style="fill:var(--hivis)"/><rect x="520" y="40" width="150" height="6" style="fill:var(--hivis)"/>`}
  return `<svg viewBox="0 0 800 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="gridp" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" style="stroke:var(--line)" stroke-width=".6"/></pattern></defs><rect width="800" height="260" fill="url(#gridp)"/>${g}</svg>`}

  <table class="rt gst"><thead><tr><th>Bill</th><th>Description</th><th class="n">Items</th><th class="n">Amount (${cur})</th><th class="n">Share</th></tr></thead><tbody>${T.bills.map((b,bi)=>`<tr><td class="item">${bi+1}</td><td>${esc(b.title)}</td><td class="n">${b.n}</td><td class="n" data-gs="${bi}">–</td><td class="n" data-gsp="${bi}">–</td></tr>`).join("")}

/* ---------- dashboard ---------- */
function viewDashboard(R){
  const T=boqTotals(R),cur=curLabel(),uc=unitCost(R,T.tot),bal=R.sum(/^EXC/)-(R.tot.BFL||0)-(R.tot.DSP||0);
  const conc={};R.items.forEach(i=>{if(CONC.has(i.code))conc[i.el]=(conc[i.el]||0)+i.q});
  const fw={};R.items.forEach(i=>{if(/^F(?!STRIS|F_)/.test(i.code))fw[i.el]=(fw[i.el]||0)+i.q});
  const dias=DIAS.filter(d=>R.bars.some(b=>b.dia===d));
  const els=[...new Set(R.bars.map(b=>b.el))];
  const bm=bomRows(R).filter(r=>!r.sec).sort((a,b)=>b.amt-a.amt);
  const stack=els.map(e=>{const tot=R.bars.filter(b=>b.el===e).reduce((a,b)=>a+b.kg,0);return {e,tot,parts:dias.map((d,i)=>({d,kg:R.bars.filter(b=>b.el===e&&b.dia===d).reduce((a,b)=>a+b.kg,0),c:PAL[i%PAL.length]}))}});
  const smax=Math.max(1,...stack.map(s=>s.tot));
  let special="";
  if(S.btype==="multi"){const v=R.lvls.map((l,i)=>({label:l.name,value:R.items.filter(x=>x.lvl===i&&CONC.has(x.code)).reduce((a,x)=>a+x.q,0)}));special=`<div class="chart"><h3>Frame concrete by level (m³)</h3>${vbars(v,{unit:"m³",dp:1,color:"var(--core)"})}</div>`}
  if(S.btype==="road"){const v=(S.pl.rpave||[]).map((p,i)=>({label:`S${i+1}`,cut:Math.abs(n(p.to)-n(p.from))*n(p.cut),fill:Math.abs(n(p.to)-n(p.from))*n(p.fill)}));
    special=`<div class="chart"><h3>Cut and fill intensity by section (m × avg depth)</h3>${vbars(v.flatMap(x=>[{label:"Cut "+x.label,value:x.cut,color:"var(--steel)"},{label:"Fill "+x.label,value:x.fill,color:"var(--core)"}]),{dp:0})}</div>`}
  if(S.btype==="bridge"){special=`<div class="chart"><h3>Reinforcement intensity (kg/m³)</h3>${hbars(Object.keys(conc).map(e=>({label:e,value:R.bars.filter(b=>b.el===e).reduce((a,b)=>a+b.kg,0)/Math.max(conc[e],1e-9)})).filter(x=>isFinite(x.value)),"kg/m³",0,"var(--steel)")}</div>`}
  return `<div class="pagehead dhead"><div><div class="kicker">${esc(S.project.stage)} · ${esc(BTYPE_LABEL[S.btype])} · ${esc(curLabel())}</div><h1>Dashboard</h1><p>${esc(S.project.name)}${S.project.location?" · "+esc(S.project.location):""}</p></div>
   <div class="dact"><button class="btn sm" data-view="boq">Open bills of quantities</button><button class="btn sm" data-view="rates">Rate analysis</button></div></div><div class="alerts" id="alerts"></div>
  <div class="kpis dk">
   <div class="kpi hero"><small>Total including contingency and ${esc(S.report.taxName||"tax")}</small><b>${T.tot?fmt(T.tot,0):"–"}</b><span>${esc(cur)}${uc&&T.tot?` · ${fmt(uc[0],0)} ${esc(uc[1])}`:""}</span></div>
   <div class="kpi"><small>Measured work</small><b>${fmt(T.sub,0)}</b><span>${T.items.filter(r=>r.rate>0).length} of ${T.items.length} items priced</span></div>
   <div class="kpi"><small>Concrete</small><b>${fmt(R.concrete,1)}</b><span>m³</span></div>
   <div class="kpi"><small>Reinforcement</small><b>${fmt(R.steelKg/1000,2)}</b><span>t · ${fmt(R.steelKg/Math.max(R.concrete,1),0)} kg/m³</span></div>
   <div class="kpi"><small>Formwork</small><b>${fmt(R.formwork,0)}</b><span>m²</span></div>
   <div class="kpi"><small>Excavation</small><b>${fmt(R.sum(/^EXC|^RCUT$/),0)}</b><span>m³ · balance ${fmt(Math.abs(bal)<0.0005?0:bal,2)}</span></div>
  </div>
  <div class="dgrid">
   <div class="chart"><h3>Cost by bill</h3>${donut(T.bills.map(b=>({label:b.title,value:b.amt,show:fmt(b.amt,0)})),{center:fmt(T.sub,0),sub:cur})}</div>
   <div class="chart"><h3>Resource split of priced work</h3>${donut(resourceSplit(T),{center:"Direct",sub:"cost"})}</div>
   <div class="chart wide"><h3>Top 10 cost items (Pareto)</h3>${pareto(T.items,cur)}</div>
   <div class="chart"><h3>Cost build-up to total</h3>${waterfall(T,cur)}</div>
   <div class="chart"><h3>Concrete by element (m³)</h3>${hbars(Object.entries(conc).map(([k,v])=>({label:k,value:v})),"m³",1)}</div>
   <div class="chart"><h3>Reinforcement by diameter (t)</h3>${vbars(dias.map((d,i)=>({label:d+" mm",value:R.bars.filter(b=>b.dia===d).reduce((a,b)=>a+b.kg,0)/1000,color:PAL[i%PAL.length]})),{unit:"t",dp:2})}</div>
   <div class="chart"><h3>Formwork by element (m²)</h3>${hbars(Object.entries(fw).map(([k,v])=>({label:k,value:v})),"m²",0,"var(--core)")}</div>
   ${stack.length?`<div class="chart wide"><h3>Reinforcement by element and diameter (kg)</h3>${stack.map(s=>`<div class="stk"><span>${esc(s.e)}</span><div class="track">${s.parts.filter(p=>p.kg>0).map(p=>`<i style="width:${p.kg/smax*100}%;background:${p.c}" title="${p.d} mm: ${fmt(p.kg,0)} kg"></i>`).join("")}</div><b>${fmt(s.tot,0)}</b></div>`).join("")}<ul class="legend inline">${dias.map((d,i)=>`<li><i style="background:${PAL[i%PAL.length]}"></i>${d} mm</li>`).join("")}</ul></div>`:""}
   <div class="chart"><h3>Largest materials by cost</h3>${hbars(bm.slice(0,8).map(r=>({label:r.mat,value:r.amt})),"",0,"var(--steel)")}</div>
   ${special}
  </div>`}

function fxBanner(){const db=(S.ra.cur||"USD").toUpperCase();if(db===curLabel())return "";
  return `<div class="alert warnish">Databank prices are in <b>${esc(db)}</b> and shown here converted at 1 ${esc(db)} = ${fmt(n(S.ra.fx),4)} ${esc(curLabel())}. <button class="btn sm" data-view="project">Change exchange rate</button> <button class="btn sm" data-act="cvConvert">Convert databank to ${esc(curLabel())}</button></div>`}
function shrinkImage(file,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.82))};img.onerror=()=>toast("That file is not an image");img.src=fr.result};fr.readAsDataURL(file)}

document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.cvrow){const [list,i,f]=t.dataset.cvrow.split("|");S.project[list][+i][f]=t.value;persist();live();return}
  if(t.dataset.cvtext){setP(t.dataset.cvtext,t.value);persist();live();return}
},true);
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.cvsel){setP(t.dataset.cvsel,t.value);e.stopImmediatePropagation();renderAll();return}
  if(t.id==="cvFile"&&t.files[0]){shrinkImage(t.files[0],url=>{S.project.image=url;renderAll();toast("Cover image added")});t.value="";e.stopImmediatePropagation()}
},true);
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.act;if(!a||!/^cv/.test(a))return;e.stopImmediatePropagation();
  if(a==="cvImg")document.getElementById("cvFile").click();
  if(a==="cvImgDel"){S.project.image="";renderAll()}
  if(a==="cvAdd"){S.project[b.dataset.list].push(b.dataset.list==="params"?{id:uid(),label:"",value:""}:{id:uid(),role:"",org:"",contact:""});renderAll()}
  if(a==="cvDel"){S.project[b.dataset.list].splice(+b.dataset.i,1);renderAll()}
  if(a==="cvConvert"){const fx=n(S.ra.fx);if(!(fx>0)){toast("Enter an exchange rate first");return}if(!confirm(`Multiply all ${S.ra.res.length} databank prices by ${fx} and store them in ${curLabel()}?`))return;
    S.ra.res.forEach(r=>r.rate=Math.round(n(r.rate)*fx*100)/100);S.ra.cur=curLabel();S.ra.fx=1;renderAll();toast(`Databank converted to ${curLabel()}`)}
},true);

const COL={off:true,ready:false,db:null,room:null,user:null,me:null,canWrite:null,projects:[],remote:null,comments:[],board:{tasks:[],activity:[]},peers:[],unsub:[],prof:{},members:[],conflict:false,saving:false,lastPresence:""};
const shareState=()=>{const {ui,collab,account,...r}=S;const c={...r,project:{...r.project,image:""}};return JSON.stringify(c)};
const hashStr=s=>{let h=0;for(let i=0;i<s.length;i+=7)h=(h*31+s.charCodeAt(i))|0;return s.length+":"+h};
async function colInit(){
  try{if(!(window.claude&&claude.use))return;
    const [db,room,user]=await Promise.all([claude.use("db"),claude.use("room"),claude.use("user")]);
    COL.db=db;COL.room=room;COL.user=user;
    if(user){COL.me=await user.me();const w=await user.can("data.write");COL.canWrite=w}
    if(!db||!COL.me?.id){colRender();return}
    COL.off=false;COL.ready=true;
    COL.unsub.push(db.collection("projects").orderBy("updatedAt","desc").limit(200).onSnapshot(s=>{COL.projects=s.docs.map(d=>({id:d.id,...d.data(),stateJson:undefined}));colIds();colRender()},e=>{}));
    if(room){room.onPeers(ch=>{COL.peers=ch.peers.filter(p=>p.presence&&p.presence.uid);colIds();colRender()});colPresence(true)}
    if(S.collab.pid)colLink(S.collab.pid,false);
    colRender();renderAll();
  }catch(e){colRender()}}
function colIds(){const ids=new Set();COL.projects.forEach(p=>p.updatedBy&&ids.add(p.updatedBy));COL.comments.forEach(c=>c.by&&ids.add(c.by));(COL.board.activity||[]).forEach(a=>a.by&&ids.add(a.by));(COL.board.tasks||[]).forEach(t=>t.assignee&&ids.add(t.assignee));COL.peers.forEach(p=>ids.add(p.presence.uid));COL.members.forEach(m=>ids.add(m.id));
  if(COL.user&&ids.size)COL.user.profiles([...ids]).then(ps=>{COL.prof=ps;colRender()})}
const pname=id=>id&&COL.me&&id===COL.me.id?"You":(COL.prof[id]?.name||"Someone");
const pav=(id,cls="")=>{const p=COL.prof[id];return p?`<img class="av ${cls}" src="${p.avatarUrl}" alt="" title="${esc(pname(id))}">`:`<span class="av ${cls}">?</span>`};
function colPresence(force){if(!COL.room||!COL.me?.id)return;const pr={uid:COL.me.id,view:S.ui.view,pid:S.collab.pid||"",item:S.ui.view==="rates"?S.ui.raSel:""};const k=JSON.stringify(pr);if(!force&&k===COL.lastPresence)return;COL.lastPresence=k;COL.room.presence(pr).catch(()=>{})}
function colLink(pid,announce=true){
  COL.unsub.splice(1).forEach(u=>{try{u()}catch(e){}});COL.comments=[];COL.board={tasks:[],activity:[]};COL.remote=null;COL.conflict=false;
  S.collab.pid=pid;if(!pid){persist();colRender();return}
  const db=COL.db,base=db.doc("projects/"+pid);
  COL.unsub.push(base.onSnapshot(s=>{if(!s.exists){COL.remote=null;colRender();return}const d=s.data();COL.remote={version:d.version,updatedAt:d.updatedAt,updatedBy:d.updatedBy,name:d.name};
    if(d.version>(S.collab.base||0)){if(!colDirty()){colApply(d)}else{COL.conflict=true}}colIds();colRender()}));
  COL.unsub.push(base.collection("comments").orderBy("at","asc").limit(500).onSnapshot(s=>{COL.comments=s.docs.map(d=>({id:d.id,...d.data()}));colIds();colRender();colBadges()}));
  COL.unsub.push(db.doc(`projects/${pid}/meta/board`).onSnapshot(s=>{COL.board=s.exists?{tasks:[],activity:[],...s.data()}:{tasks:[],activity:[]};colIds();colRender()}));
  persist();colPresence(true);if(announce)toast("Linked to the team workspace");}
function colDirty(){return !!S.collab.pid&&hashStr(shareState())!==S.collab.hash}
async function colApply(d){
  try{const st=JSON.parse(d.stateJson);const keep={ui:S.ui,collab:S.collab,account:S.account};const img=S.project.image;
    S=deepMerge(defaults(),st);S.types=st.types;S.pl=st.pl;S.levels=st.levels||S.levels;if(st.ra)S.ra=st.ra;Object.assign(S,keep);ensureCover();
    S.project.image=img;try{const f=await COL.db.doc(`projects/${d.id||S.collab.pid}/files/cover`).get();if(f.exists)S.project.image=f.data().data||""}catch(e){}
    S.collab.base=d.version;S.collab.hash=hashStr(shareState());COL.conflict=false;renderAll();}catch(e){toast("Could not read the shared version")}}
async function colPush(force=false){
  if(COL.off||!S.collab.pid||COL.saving)return;if(COL.canWrite===false){toast("You have view-only access to this workspace");return}
  if(!force&&COL.remote&&COL.remote.version>(S.collab.base||0)){COL.conflict=true;colRender();toast("A teammate saved a newer version – choose which to keep");return}
  const json=shareState();if(json.length>240000){toast("This project is too large to share in one document");return}
  COL.saving=true;colRender();
  try{const v=Math.max(COL.remote?.version||0,S.collab.base||0)+1,pid=S.collab.pid,db=COL.db;
    await db.doc("projects/"+pid).set({name:S.project.name,btype:S.btype,currency:curLabel(),stage:S.project.stage,updatedAt:Date.now(),updatedBy:COL.me.id,createdBy:COL.remote?.createdBy||COL.me.id,version:v,stateJson:json});
    if(S.project.image&&S.project.image.length<240000&&S.collab.img!==hashStr(S.project.image)){await db.doc(`projects/${pid}/files/cover`).set({data:S.project.image});S.collab.img=hashStr(S.project.image)}
    S.collab.base=v;S.collab.hash=hashStr(json);COL.conflict=false;await colLog(`saved version ${v}`);persist();toast(`Saved version ${v} to the workspace`)
  }catch(e){toast(e?.code==="quota_exceeded"?"The workspace is full – delete old projects":e?.code==="invalid_argument"?"You cannot write to this workspace":"Could not save – try again")}
  COL.saving=false;colRender()}
async function colLog(text){if(!S.collab.pid)return;const ref=COL.db.doc(`projects/${S.collab.pid}/meta/board`);const cur=COL.board||{tasks:[],activity:[]};
  const act=[{at:Date.now(),by:COL.me.id,text},...(cur.activity||[])].slice(0,40);try{await ref.set({tasks:cur.tasks||[],activity:act});}catch(e){}}
async function colBoardWrite(tasks,logText){const ref=COL.db.doc(`projects/${S.collab.pid}/meta/board`);const act=logText?[{at:Date.now(),by:COL.me.id,text:logText},...(COL.board.activity||[])].slice(0,40):(COL.board.activity||[]);
  COL.board={tasks,activity:act};colRender();try{await ref.set({tasks,activity:act})}catch(e){toast("Could not update tasks")}}
let colAutoT;
function colAfterRender(){colPresence();if(COL.off||!S.collab.pid)return;const pill=document.getElementById("syncPill");if(pill)pill.outerHTML=syncPill();
  if(S.collab.auto&&colDirty()&&!COL.conflict){clearTimeout(colAutoT);colAutoT=setTimeout(()=>colPush(),4000)}}
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?"just now":s<3600?`${Math.round(s/60)} min ago`:s<86400?`${Math.round(s/3600)} h ago`:new Date(t).toLocaleDateString((S.project.numfmt)||"en-GB")};
function syncPill(){if(COL.off)return `<span id="syncPill" class="sync off" title="Collaboration is not available in this view">Single user</span>`;
  if(!S.collab.pid)return `<button id="syncPill" class="sync" data-view="team">Not shared</button>`;
  if(COL.conflict)return `<button id="syncPill" class="sync warn" data-view="team">Newer version available</button>`;
  if(COL.saving)return `<span id="syncPill" class="sync">Saving…</span>`;
